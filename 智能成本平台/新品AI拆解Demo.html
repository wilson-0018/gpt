<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新品 AI 拆解 · 成本建模工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#152943;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{background:#152c49;color:white;padding:15px max(5vw,18px);display:flex;align-items:center;justify-content:space-between}header b{letter-spacing:.06em}header small{color:#c2d4e9}main{max-width:1220px;margin:auto;padding:28px 22px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:18px;margin:0 0 12px}p{margin:6px 0 12px;color:#516579}.grid{display:grid;grid-template-columns:minmax(280px,.86fr) minmax(400px,1.4fr);gap:16px;margin-top:18px}section{background:white;border:1px solid #d6e0eb;border-radius:12px;padding:20px;margin-bottom:14px}.result{background:#173c64;color:white}.result p{color:#cedef0}.number{font-size:28px;font-weight:700}textarea,input,select,button{font:inherit}textarea,input,select{border:1px solid #b9c8d9;border-radius:6px;padding:6px;width:100%;background:white;color:#163453}textarea{height:162px;resize:vertical}label{display:block;margin:8px 0;font-size:14px}button{padding:8px 15px;background:#175cb0;color:white;border:0;border-radius:6px;cursor:pointer;margin:5px 5px 0 0}button:disabled{background:#dde4ed;color:#64778b;cursor:default}.secondary{background:#e5edf8;color:#164c89}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e2e8ef;padding:7px 4px}th{color:#516579}td input{width:86px}small{font-size:12px}.warn{color:#945511}.tag{color:#126447;background:#ddf3e8;padding:2px 8px;border-radius:4px}#message{min-height:24px;color:#135992}.pill{border-left:3px solid #4085ca;padding-left:10px}details{margin-top:9px}pre{white-space:pre-wrap}.history{padding:7px;background:#f5f8fc} @media(max-width:800px){.grid{display:block}main{padding:18px 12px}section{padding:14px}header small{display:none}}
</style><header><b>智能成本平台</b><small>新品成本工程　/　模型工作台</small></header><main><h1>新品 AI 拆解</h1><p>从研发规格生成器件成本模型，核对参数来源后试算并确认版本。</p><div class="grid"><div><section><h2>01　研发输入</h2><p>电池模组样例 · 概念阶段 · 演示数据</p><label>需求版本（IPM 样例）<select id="revision"><option>R1</option><option>R2</option></select></label><label>规格文本或本地 TXT 文件<input type="file" id="upload" accept=".txt,text/plain"></label><textarea id="spec" aria-label="研发规格文本"></textarea><button id="extract">提取参数并匹配模型</button><p><small>本页在浏览器中模拟 AI 提取，仅识别样例中的结构化字段。文档内容留在当前页面。</small></p></section><section><h2>02　模型匹配依据</h2><div id="match">提取规格后显示历史配置和差异。</div></section></div><div><section><h2>03　成本模型初版</h2><div id="editor">请先选择需求版本并提取参数。</div></section><section class="result"><h2>单颗模组成本区间</h2><div id="amount" class="number">待建模</div><p id="detail">补齐关键参数后即可试算。</p></section><section><h2>04　人工确认与版本</h2><label>补数依据或修改理由<input id="note" placeholder="例如：采购已向工厂确认本次试产良率为96%"></label><button id="release" disabled>确认并保存模型版本</button><div id="message" role="status"></div><div id="history"></div></section></div></div></main><script>
const by=id=>document.getElementById(id);
const samples={R1:'品类：电池模组\n容量：5000 mAh\n封装：软包\n额定能量：19.25 Wh\n良率：待研发确认',R2:'品类：电池模组\n容量：5200 mAh\n封装：软包\n额定能量：20.02 Wh\n良率：96%'};
const names=['额定能量（Wh）','电芯单价（元/Wh）','保护板及辅材（元）','组装测试费（元）','良率（%）'];
let versions=[],sources=[],built=false,range=null,rev='',lastText='';
try{versions=JSON.parse(localStorage.getItem('cost-demo-versions')||'[]');if(!Array.isArray(versions))versions=[]}catch{}
function history(){by('history').replaceChildren();versions.slice().reverse().forEach(v=>{const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');d.className='history';s.textContent=v.id+' · '+v.rev+' · '+v.range;p.textContent=v.note+'\n'+v.lines.join('\n');d.append(s,p);by('history').append(d)})}
function invalidate(){built=false;range=null;by('release').disabled=true;by('editor').textContent='等待提取当前资料';by('match').textContent='等待匹配';by('amount').textContent='待建模';by('detail').textContent='资料更新后请重新提取。';by('message').textContent='';by('note').value=''}
function sample(){by('spec').value=samples[by('revision').value];invalidate()}
by('revision').onchange=sample;by('spec').oninput=invalidate;by('upload').onchange=async e=>{let f=e.target.files[0];if(f){by('spec').value=await f.text();invalidate()}};
function calc(){let values=names.map((_,i)=>by('p'+i).value.trim());let n=values.map(Number);let missing=names.filter((_,i)=>!values[i]||!Number.isFinite(n[i])||(i===0||i===4?n[i]<=0:n[i]<0)||(i===4&&n[i]>100));range=null;if(missing.length){by('amount').textContent='待补参数';by('detail').textContent=missing.join('、')+' 需要有效数值。'}else{let total=k=>((n[0]*n[1]*k+n[2])/(n[4]/100)+n[3]).toFixed(2);range='¥'+total(.95)+' – ¥'+total(1.05);by('amount').textContent=range;by('detail').textContent='基准成本 ¥'+total(1)+' / 颗。上下界按电芯单价 ±5% 的演示情景测算。'}by('release').disabled=!range||!by('note').value.trim()}
by('note').oninput=()=>{if(built)calc()};
by('extract').onclick=()=>{invalidate();const str=by('spec').value,lines=str.split(/\r?\n/);if(!/电池模组/.test(str)||!/软包/.test(str)){by('match').textContent='未匹配软包电池模组模板，请核对品类和封装。';return}let read=(key)=>{let i=lines.findIndex(l=>l.trim().startsWith(key));let m=i<0?null:lines[i].match(/[：:]\s*(\d+(?:\.\d+)?)/);return [m?m[1]:'',m?'需求第'+(i+1)+'行':'缺项，需确认']};let [energy,es]=read('额定能量'),[yieldVal,ys]=read('良率'),[cap]=read('容量');rev=by('revision').value;lastText=str;by('match').textContent='匹配「软包电池模组 SC-BAT-01」。历史样例容量为5000 mAh，本版为'+(cap||'待确认')+' mAh。沿用电芯、保护板及组装费结构，按本版能量和良率重新计算。';let vals=[energy,1.62,4.8,2.1,yieldVal];sources=[es,'历史模板 · 单价','历史模板 · 辅材','历史模板 · 工费',ys];by('editor').innerHTML='<table><thead><tr><th>成本参数</th><th>可编辑初值</th><th>来源</th></tr></thead><tbody>'+names.map((n,i)=>'<tr><td>'+n+'</td><td><input type="number" step="any" min="0" aria-label="'+n+'" id="p'+i+'" value="'+vals[i]+'"></td><td id="s'+i+'">'+sources[i]+'</td></tr>').join('')+'</tbody></table><p class="pill">模组成本＝（额定能量 × 电芯单价 ＋ 保护板及辅材）÷ 良率 ＋ 组装测试费</p>';names.forEach((_,i)=>by('p'+i).oninput=()=>{sources[i]='人工修订';by('s'+i).textContent=sources[i];calc()});built=true;calc()};
by('release').onclick=()=>{if(!built||!range||!by('note').value.trim())return;const v={id:'V'+(versions.length+1),rev,range,note:by('note').value,lines:names.map((n,i)=>n+'　'+by('p'+i).value+'　'+sources[i]).concat(['需求原文',lastText])};versions.push(v);let saved=true;try{localStorage.setItem('cost-demo-versions',JSON.stringify(versions))}catch{saved=false}history();by('release').disabled=true;by('message').textContent=v.id+(saved?' 已保存至本浏览器。':' 已保存在当前页面，浏览器未允许持久保存。')};sample();history();
</script></html>
